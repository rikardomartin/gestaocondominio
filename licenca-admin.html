<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Licenças - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

        .login-screen {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .login-box {
            background: #1e293b; border: 1px solid #334155; border-radius: 12px;
            padding: 40px; width: 100%; max-width: 380px;
        }
        .login-box h1 { font-size: 1.4rem; margin-bottom: 8px; color: #f1f5f9; }
        .login-box p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 28px; }

        .admin-screen { display: none; padding: 24px; max-width: 900px; margin: 0 auto; }
        .admin-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid #334155;
        }
        .admin-header h1 { font-size: 1.5rem; color: #f1f5f9; }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
        input {
            width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155;
            border-radius: 8px; color: #f1f5f9; font-size: 0.95rem; outline: none;
        }
        input:focus { border-color: #3b82f6; }

        .btn {
            padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;
            font-size: 0.9rem; font-weight: 600; transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: #3b82f6; color: white; width: 100%; padding: 12px; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-success { background: #22c55e; color: white; }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
        .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #334155; }

        .clients-grid { display: grid; gap: 16px; }
        .client-card {
            background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center; gap: 16px;
        }
        .client-card.blocked { border-color: #ef4444; background: #1e1010; }
        .client-info h3 { font-size: 1rem; color: #f1f5f9; margin-bottom: 4px; }
        .client-info p { font-size: 0.8rem; color: #64748b; }
        .client-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

        .badge {
            display: inline-block; padding: 3px 10px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 600;
        }
        .badge-active { background: #14532d; color: #4ade80; }
        .badge-blocked { background: #450a0a; color: #f87171; }

        .add-client-form {
            background: #1e293b; border: 1px solid #334155; border-radius: 12px;
            padding: 24px; margin-bottom: 24px;
        }
        .add-client-form h2 { font-size: 1rem; margin-bottom: 16px; color: #94a3b8; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .toast {
            position: fixed; bottom: 24px; right: 24px; padding: 12px 20px;
            border-radius: 8px; font-size: 0.9rem; font-weight: 500;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999;
        }
        .toast.show { opacity: 1; }
        .toast-success { background: #14532d; color: #4ade80; border: 1px solid #166534; }
        .toast-error { background: #450a0a; color: #f87171; border: 1px solid #7f1d1d; }

        .empty { text-align: center; padding: 48px; color: #475569; }
        .empty svg { width: 48px; height: 48px; margin: 0 auto 12px; display: block; opacity: 0.4; }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
            .client-card { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <h1>🔐 Painel Admin</h1>
        <p>Acesso restrito ao desenvolvedor</p>
        <div class="form-group">
            <label>Senha de Acesso</label>
            <input type="password" id="adminPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter') login()">
        </div>
        <button class="btn btn-primary" onclick="login()">Entrar</button>
    </div>
</div>

<!-- PAINEL ADMIN -->
<div class="admin-screen" id="adminScreen">
    <div class="admin-header">
        <h1>⚙️ Gerenciador de Licenças</h1>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Sair</button>
    </div>

    <!-- Adicionar cliente -->
    <div class="add-client-form">
        <h2>+ Adicionar / Atualizar Cliente</h2>
        <div class="form-row">
            <div class="form-group">
                <label>ID do Cliente (projectId Firebase)</label>
                <input type="text" id="newClientId" placeholder="ex: gestaodoscondominios">
            </div>
            <div class="form-group">
                <label>Nome do Cliente</label>
                <input type="text" id="newClientName" placeholder="ex: João Silva">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Observação</label>
                <input type="text" id="newClientObs" placeholder="ex: Pendência R$ 2.000">
            </div>
            <div class="form-group" style="display:flex;align-items:flex-end;">
                <button class="btn btn-primary" onclick="addClient()" style="width:100%">Salvar Cliente</button>
            </div>
        </div>
    </div>

    <!-- Lista de clientes -->
    <div class="clients-grid" id="clientsList">
        <div class="empty">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            Carregando clientes...
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs, updateDoc, serverTimestamp }
        from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
        apiKey: "AIzaSyDw1XIkVyMMPfGLCeF4GpMJ6kEZ8HeeuF8",
        authDomain: "gestaodoscondominios.firebaseapp.com",
        projectId: "gestaodoscondominios",
        storageBucket: "gestaodoscondominios.firebasestorage.app",
        messagingSenderId: "20572242752",
        appId: "1:20572242752:web:c1b533c1bb905e81b0f0a5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Senha local do painel (mude para algo forte)
    const ADMIN_PASS = 'dev@2026#admin';

    window.login = function() {
        const pass = document.getElementById('adminPassword').value;
        if (pass === ADMIN_PASS) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminScreen').style.display = 'block';
            loadClients();
        } else {
            showToast('Senha incorreta', 'error');
        }
    };

    window.logout = function() {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('adminScreen').style.display = 'none';
        document.getElementById('adminPassword').value = '';
    };

    window.addClient = async function() {
        const id = document.getElementById('newClientId').value.trim();
        const name = document.getElementById('newClientName').value.trim();
        const obs = document.getElementById('newClientObs').value.trim();
        if (!id || !name) return showToast('Preencha ID e Nome', 'error');

        try {
            await setDoc(doc(db, 'licencas', id), {
                nome: name,
                observacao: obs,
                ativo: true,
                criadoEm: serverTimestamp(),
                atualizadoEm: serverTimestamp()
            }, { merge: true });
            showToast('Cliente salvo!', 'success');
            document.getElementById('newClientId').value = '';
            document.getElementById('newClientName').value = '';
            document.getElementById('newClientObs').value = '';
            loadClients();
        } catch (e) {
            showToast('Erro: ' + e.message, 'error');
        }
    };

    window.toggleLicenca = async function(id, ativar) {
        try {
            await updateDoc(doc(db, 'licencas', id), {
                ativo: ativar,
                atualizadoEm: serverTimestamp()
            });
            showToast(ativar ? '✅ Sistema liberado!' : '🔒 Sistema bloqueado!', ativar ? 'success' : 'error');
            loadClients();
        } catch (e) {
            showToast('Erro: ' + e.message, 'error');
        }
    };

    async function loadClients() {
        const list = document.getElementById('clientsList');
        try {
            const snap = await getDocs(collection(db, 'licencas'));
            if (snap.empty) {
                list.innerHTML = `<div class="empty">Nenhum cliente cadastrado ainda.</div>`;
                return;
            }
            list.innerHTML = snap.docs.map(d => {
                const c = d.data();
                const ativo = c.ativo !== false;
                return `
                <div class="client-card ${ativo ? '' : 'blocked'}">
                    <div class="client-info">
                        <h3>${c.nome || d.id}</h3>
                        <p>ID: ${d.id} ${c.observacao ? '· ' + c.observacao : ''}</p>
                    </div>
                    <div class="client-actions">
                        <span class="badge ${ativo ? 'badge-active' : 'badge-blocked'}">
                            ${ativo ? '✅ Ativo' : '🔒 Bloqueado'}
                        </span>
                        ${ativo
                            ? `<button class="btn btn-danger btn-sm" onclick="toggleLicenca('${d.id}', false)">Bloquear</button>`
                            : `<button class="btn btn-success btn-sm" onclick="toggleLicenca('${d.id}', true)">Liberar</button>`
                        }
                    </div>
                </div>`;
            }).join('');
        } catch (e) {
            list.innerHTML = `<div class="empty">Erro ao carregar: ${e.message}</div>`;
        }
    }

    function showToast(msg, type) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = `toast toast-${type} show`;
        setTimeout(() => t.className = 'toast', 3000);
    }
</script>
</body>
</html>
