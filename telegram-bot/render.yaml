services:
  - type: worker
    name: chatcondominios-bot
    runtime: node
    rootDir: telegram-bot
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
