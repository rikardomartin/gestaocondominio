<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixa em Massa por Mes/Ano</title>
    <style>
        body {
            margin: 0;
            font-family: Segoe UI, Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }
        .wrap {
            max-width: 920px;
            margin: 24px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
            padding: 20px;
        }
        h1 {
            margin: 0 0 6px 0;
            font-size: 24px;
        }
        .sub {
            margin: 0 0 14px 0;
            color: #4b5563;
        }
        .warning {
            background: #fffbeb;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 14px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #374151;
        }
        input, select {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
        }
        .check {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .check input {
            width: auto;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .login-btn {
            background: #2563eb;
            color: #fff;
        }
        .run-btn {
            background: #059669;
            color: #fff;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            margin-top: 12px;
            border-radius: 8px;
            background: #eef2ff;
            color: #1e40af;
            padding: 10px;
        }
        .progress {
            margin-top: 10px;
            height: 10px;
            background: #e5e7eb;
            border-radius: 99px;
            overflow: hidden;
        }
        .bar {
            height: 100%;
            width: 0%;
            background: #10b981;
            transition: width 0.2s ease;
        }
        .stats {
            margin-top: 12px;
            display: grid;
            grid-template-columns: repeat(5, minmax(120px, 1fr));
            gap: 10px;
        }
        .card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 10px;
        }
        .card .n {
            font-size: 20px;
            font-weight: 700;
        }
        .log {
            margin-top: 12px;
            height: 320px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: Consolas, monospace;
            font-size: 12px;
            border-radius: 8px;
            background: #0f172a;
            color: #e2e8f0;
            padding: 10px;
        }
        @media (max-width: 820px) {
            .grid, .grid-2 {
                grid-template-columns: 1fr;
            }
            .stats {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Baixa em Massa por Mes/Ano</h1>
        <p class="sub">Use esta tela para marcar todas as unidades ativas em qualquer mes/ano.</p>

        <div class="warning">
            Dica: rode primeiro em modo teste. Depois execute de verdade com lote menor para reduzir risco de limite diario.
        </div>

        <div class="grid">
            <div>
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="admin@condominio.com">
            </div>
            <div>
                <label for="password">Senha</label>
                <input id="password" type="password" placeholder="Sua senha">
            </div>
            <div>
                <label for="statusSelect">Status</label>
                <select id="statusSelect">
                    <option value="pago" selected>pago</option>
                    <option value="reciclado">reciclado</option>
                    <option value="acordo">acordo</option>
                    <option value="pendente">pendente</option>
                </select>
            </div>
        </div>

        <div class="grid">
            <div>
                <label for="yearInput">Ano</label>
                <input id="yearInput" type="number" min="2024" max="2040" value="2026">
            </div>
            <div>
                <label for="monthInput">Mes (01-12)</label>
                <input id="monthInput" type="number" min="1" max="12" value="3">
            </div>
            <div>
                <label for="valueInput">Valor (vazio = automatico por status)</label>
                <input id="valueInput" type="number" step="0.01" min="0" placeholder="ex: 80">
            </div>
        </div>

        <div class="grid-2">
            <div>
                <label for="batchInput">Tamanho do lote (max 450)</label>
                <input id="batchInput" type="number" min="1" max="450" value="250">
            </div>
            <div>
                <label for="delayInput">Pausa entre lotes (ms)</label>
                <input id="delayInput" type="number" min="0" max="10000" value="800">
            </div>
            <div>
                <label for="maxWritesInput">Maximo de escritas por execucao</label>
                <input id="maxWritesInput" type="number" min="1" value="5000">
            </div>
            <div class="check">
                <input id="dryRunInput" type="checkbox">
                <label for="dryRunInput">Modo teste (sem gravar)</label>
            </div>
        </div>

        <div class="actions">
            <button id="loginBtn" class="login-btn">Fazer Login</button>
            <button id="runBtn" class="run-btn" disabled>Executar Baixa em Massa</button>
        </div>

        <div id="status" class="status">Aguardando login...</div>
        <div class="progress"><div id="bar" class="bar"></div></div>

        <div class="stats">
            <div class="card"><div>Total unidades</div><div id="sTotal" class="n">0</div></div>
            <div class="card"><div>Processadas</div><div id="sProcessed" class="n">0</div></div>
            <div class="card"><div>Escritas</div><div id="sWrites" class="n">0</div></div>
            <div class="card"><div>Puladas</div><div id="sSkipped" class="n">0</div></div>
            <div class="card"><div>Erros</div><div id="sErrors" class="n">0</div></div>
        </div>

        <div id="log" class="log"></div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import {
            getFirestore,
            collection,
            query,
            where,
            getDocs,
            doc,
            setDoc,
            writeBatch,
            serverTimestamp
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyDw1XIkVyMMPfGLCeF4GpMJ6kEZ8HeeuF8',
            authDomain: 'gestaodoscondominios.firebaseapp.com',
            projectId: 'gestaodoscondominios',
            storageBucket: 'gestaodoscondominios.firebasestorage.app',
            messagingSenderId: '20572242752',
            appId: '1:20572242752:web:c1b533c1bb905e81b0f0a5',
            measurementId: 'G-DSGCBWM9Q1'
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const el = {
            email: document.getElementById('email'),
            password: document.getElementById('password'),
            statusSelect: document.getElementById('statusSelect'),
            yearInput: document.getElementById('yearInput'),
            monthInput: document.getElementById('monthInput'),
            valueInput: document.getElementById('valueInput'),
            batchInput: document.getElementById('batchInput'),
            delayInput: document.getElementById('delayInput'),
            maxWritesInput: document.getElementById('maxWritesInput'),
            dryRunInput: document.getElementById('dryRunInput'),
            loginBtn: document.getElementById('loginBtn'),
            runBtn: document.getElementById('runBtn'),
            status: document.getElementById('status'),
            bar: document.getElementById('bar'),
            log: document.getElementById('log'),
            sTotal: document.getElementById('sTotal'),
            sProcessed: document.getElementById('sProcessed'),
            sWrites: document.getElementById('sWrites'),
            sSkipped: document.getElementById('sSkipped'),
            sErrors: document.getElementById('sErrors')
        };

        const stats = { total: 0, processed: 0, writes: 0, skipped: 0, errors: 0 };

        function now() {
            return new Date().toLocaleTimeString('pt-BR');
        }

        function log(msg) {
            el.log.textContent += `[${now()}] ${msg}\n`;
            el.log.scrollTop = el.log.scrollHeight;
        }

        function setStatus(msg) {
            el.status.textContent = msg;
        }

        function updateStats() {
            el.sTotal.textContent = String(stats.total);
            el.sProcessed.textContent = String(stats.processed);
            el.sWrites.textContent = String(stats.writes);
            el.sSkipped.textContent = String(stats.skipped);
            el.sErrors.textContent = String(stats.errors);
        }

        function updateProgress() {
            const pct = stats.total > 0 ? Math.round((stats.processed / stats.total) * 100) : 0;
            el.bar.style.width = `${pct}%`;
        }

        function toInt(v, fallback) {
            const n = Number(v);
            return Number.isFinite(n) ? Math.floor(n) : fallback;
        }

        function toFloat(v, fallback) {
            const n = Number(v);
            return Number.isFinite(n) ? n : fallback;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function getDefaultValue(status) {
            if (status === 'pago') return 80;
            if (status === 'reciclado') return 40;
            return 0;
        }

        function buildPeriod(year, monthNum) {
            const month = String(monthNum).padStart(2, '0');
            return {
                year: String(year),
                month,
                date: `${year}-${month}`
            };
        }

        function isPaymentAlreadyCorrect(existing, target) {
            if (!existing) return false;
            return (
                String(existing.ano || '') === target.year &&
                String(existing.mes || '') === target.month &&
                existing.date === target.date &&
                existing.type === 'condominio' &&
                existing.status === target.status &&
                Number(existing.value || 0) === Number(target.value || 0)
            );
        }

        async function commitWithRetry(batch, retries) {
            let attempt = 0;
            while (true) {
                try {
                    await batch.commit();
                    return;
                } catch (error) {
                    attempt++;
                    const code = String(error.code || '').toLowerCase();
                    const retriable = ['resource-exhausted', 'deadline-exceeded', 'unavailable', 'aborted'];
                    if (attempt > retries || !retriable.some(k => code.includes(k))) {
                        throw error;
                    }
                    const wait = 500 * Math.pow(2, attempt);
                    log(`Falha transitoria (${error.code || 'sem-codigo'}). Retry ${attempt}/${retries} em ${wait}ms.`);
                    await sleep(wait);
                }
            }
        }

        async function handleLogin() {
            const email = el.email.value.trim();
            const password = el.password.value.trim();
            if (!email || !password) {
                alert('Informe email e senha.');
                return;
            }

            try {
                el.loginBtn.disabled = true;
                setStatus('Autenticando...');
                const cred = await signInWithEmailAndPassword(auth, email, password);
                setStatus(`Autenticado: ${cred.user.email}`);
                el.runBtn.disabled = false;
                log(`Login OK: ${cred.user.email}`);
            } catch (error) {
                setStatus(`Erro de login: ${error.code || error.message}`);
                log(`Erro de login: ${error.code || ''} ${error.message}`);
            } finally {
                el.loginBtn.disabled = false;
            }
        }

        async function runBulk() {
            const year = toInt(el.yearInput.value, NaN);
            const monthNum = toInt(el.monthInput.value, NaN);
            const status = String(el.statusSelect.value || 'pago');
            const batchSize = Math.max(1, Math.min(450, toInt(el.batchInput.value, 250)));
            const delayMs = Math.max(0, toInt(el.delayInput.value, 800));
            const maxWrites = Math.max(1, toInt(el.maxWritesInput.value, 5000));
            const dryRun = el.dryRunInput.checked;
            const customValueRaw = el.valueInput.value.trim();

            if (!Number.isInteger(year) || year < 2024 || year > 2040) {
                alert('Ano invalido. Use entre 2024 e 2040.');
                return;
            }
            if (!Number.isInteger(monthNum) || monthNum < 1 || monthNum > 12) {
                alert('Mes invalido. Use 1 a 12.');
                return;
            }

            const period = buildPeriod(year, monthNum);
            const value = customValueRaw !== '' ? toFloat(customValueRaw, getDefaultValue(status)) : getDefaultValue(status);

            const ok = confirm(
                `Confirma baixa em massa?\n\nPeriodo: ${period.date}\nStatus: ${status}\nValor: ${value}\nModo teste: ${dryRun ? 'SIM' : 'NAO'}`
            );
            if (!ok) return;

            stats.total = 0;
            stats.processed = 0;
            stats.writes = 0;
            stats.skipped = 0;
            stats.errors = 0;
            updateStats();
            updateProgress();

            el.runBtn.disabled = true;
            setStatus('Carregando dados...');
            log(`Inicio: periodo=${period.date}, status=${status}, valor=${value}, lote=${batchSize}, pausa=${delayMs}ms, maxWrites=${maxWrites}, dryRun=${dryRun}`);

            try {
                const apartmentsSnap = await getDocs(query(
                    collection(db, 'apartamentos'),
                    where('active', '==', true)
                ));
                const apartments = apartmentsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                apartments.sort((a, b) => String(a.numero || '').localeCompare(String(b.numero || ''), 'pt-BR', { numeric: true }));
                stats.total = apartments.length;
                updateStats();
                log(`Unidades ativas: ${apartments.length}`);

                const paymentsSnap = await getDocs(query(
                    collection(db, 'payments'),
                    where('date', '==', period.date)
                ));
                const existingByApartment = new Map();
                let duplicates = 0;
                paymentsSnap.forEach(p => {
                    const data = p.data();
                    if (!data.apartamentoId || data.type !== 'condominio') return;
                    if (existingByApartment.has(data.apartamentoId)) {
                        duplicates++;
                        return;
                    }
                    existingByApartment.set(data.apartamentoId, { id: p.id, ...data });
                });
                log(`Pagamentos existentes no periodo: ${existingByApartment.size}, duplicados: ${duplicates}`);

                let reachedLimit = false;
                for (let i = 0; i < apartments.length; i += batchSize) {
                    const chunk = apartments.slice(i, i + batchSize);
                    const batch = writeBatch(db);
                    let chunkWrites = 0;

                    for (const apt of chunk) {
                        const existing = existingByApartment.get(apt.id);
                        if (isPaymentAlreadyCorrect(existing, { ...period, status, value })) {
                            stats.skipped++;
                            stats.processed++;
                            continue;
                        }

                        if (stats.writes + chunkWrites >= maxWrites) {
                            reachedLimit = true;
                            break;
                        }

                        const payload = {
                            apartamentoId: apt.id,
                            condominioId: apt.condominioId || null,
                            blocoId: apt.blocoId || null,
                            apartamentoNumero: apt.numero || '',
                            tipo: apt.tipo || 'apartamento',
                            ano: period.year,
                            mes: period.month,
                            date: period.date,
                            type: 'condominio',
                            status: status,
                            value: value,
                            observacao: `Baixa em massa ${period.date}`,
                            updatedAt: serverTimestamp()
                        };

                        let ref;
                        if (existing) {
                            ref = doc(db, 'payments', existing.id);
                        } else {
                            ref = doc(collection(db, 'payments'));
                            payload.createdAt = serverTimestamp();
                        }

                        batch.set(ref, payload, { merge: true });
                        chunkWrites++;
                        stats.processed++;
                    }

                    if (chunkWrites > 0) {
                        if (!dryRun) {
                            await commitWithRetry(batch, 5);
                        }
                        stats.writes += chunkWrites;
                        log(`${dryRun ? '[DRY-RUN] ' : ''}Lote ${Math.floor(i / batchSize) + 1}: ${chunkWrites} gravacoes.`);
                    }

                    updateStats();
                    updateProgress();

                    if (reachedLimit) {
                        log(`Parado por limite de escritas (${maxWrites}). Rode novamente para continuar.`);
                        break;
                    }

                    if (delayMs > 0) await sleep(delayMs);
                }

                setStatus(`Concluido. Processadas=${stats.processed}, Escritas=${stats.writes}, Puladas=${stats.skipped}, Erros=${stats.errors}`);
                log(`Fim. Processadas=${stats.processed}, Escritas=${stats.writes}, Puladas=${stats.skipped}, Erros=${stats.errors}`);
            } catch (error) {
                stats.errors++;
                updateStats();
                setStatus(`Falha: ${error.message}`);
                log(`ERRO FATAL: ${error.code || ''} ${error.message}`);
            } finally {
                el.runBtn.disabled = false;
            }
        }

        el.loginBtn.addEventListener('click', handleLogin);
        el.runBtn.addEventListener('click', runBulk);
        el.password.addEventListener('keypress', e => {
            if (e.key === 'Enter') handleLogin();
        });

        log('Tela pronta. Faca login para comecar.');
    </script>
</body>
</html>
